name: Task-Reviewer Image

on:
  push:
    branches:
      - main
    
jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff
      
      - name: ruff check ./backend

  tests:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip -r install ./backend/requirements.txt

      - name: Run tests
        run: pytest ./Tests



  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/task-reviewer-backend:latest ./backend

      - name: Build Frontend mage
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/task-reviewer-frontend:latest ./frontend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/task-reviewer-backend:latest

      - name: Push Fronetend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/task-reviewer-frontend:latest
