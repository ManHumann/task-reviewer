name: Task-Reviewer Image

on:
  push:
    branches:
      - main
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/task-reviewer-backend:latest ./backend

      - name: Build Frontend mage
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/task-reviewer-frontend:latest ./frontend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/task-reviewer-backend:latest

      - name: Push Fronetend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/task-reviewer-frontend:latest
